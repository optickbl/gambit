<!doctype html>
<html lang="en" data-theme="green">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gambit</title>
<meta name="theme-color" content="#1f1d1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gambit">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="apple-touch-startup-image" href="splash/1320x2868.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash/1206x2622.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash/1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash/1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash/1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash/1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash/1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash/1242x2688.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash/828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash/750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="fonts/barlow-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="pieces.css">
<style>
@font-face{font-family:Barlow;font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Barlow;font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Barlow;font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}

:root{
  --bg:#1f1d1a;--surface:#2a2824;--surface-2:#35322d;--surface-3:#46423b;--hair:rgba(255,255,255,.07);
  --text:#f1eee8;--text-2:#aaa498;--text-3:#7d786f;
  --go:#86b84e;--go-ink:#13210a;--go-edge:#5c8632;--gold:#e2b046;--red:#e5554e;--blue:#6aa8e8;--orange:#f08a3c;--nota:#d6c08b;
  --sq-l:#ebecd0;--sq-d:#739552;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
[data-theme=brown]{--sq-l:#f0d9b5;--sq-d:#b58863}
[data-theme=blue]{--sq-l:#dee3e6;--sq-d:#8ca2ad}

*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:400 16px/1.45 Barlow,system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
[role=button]{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--go);outline-offset:2px;border-radius:6px}
#app{max-width:560px;margin:0 auto;min-height:100vh}
#app.has-tabs{padding-bottom:calc(env(safe-area-inset-bottom) + 92px)}
#app.has-dock{padding-bottom:calc(env(safe-area-inset-bottom) + 96px)}
#app.enter{animation:enter .18s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(4px)}}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* type */
.display{font:700 34px/1.02 var(--cond);letter-spacing:.1px}
.h2{font:600 21px/1.2 var(--cond);margin:30px 16px 10px}
.h3{font:600 18px/1.2 var(--cond);margin:22px 0 8px;color:var(--text-2)}
.nota{color:var(--nota);font-weight:600;font-variant-numeric:tabular-nums}
.nota.lg{display:block;font-size:17px;margin:18px 0 8px}
.lead{font-size:16.5px;line-height:1.5;margin-bottom:8px}
.muted{color:var(--text-2);font-size:15px}

/* headers */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(env(safe-area-inset-top) + 14px) 16px 12px}
.brand{display:flex;align-items:center;gap:4px;font:700 29px/1 var(--cond)}
.brand .pc{width:34px;height:34px}
.stats{display:flex;gap:8px}
.stat{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 12px 0 10px;border-radius:17px;background:var(--surface);font:700 18px/1 var(--cond)}
.stat .ic{width:18px;height:18px}
.stat.fire .ic{color:var(--orange)}
.stat.xp .ic{color:var(--gold)}
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 8px) 8px 8px;background:rgba(31,29,26,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.iconbtn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.iconbtn:active{background:var(--surface)}
.iconbtn .ic{width:24px;height:24px}
.bt{flex:1;min-width:0}
.bt b{display:block;font:700 21px/1.15 var(--cond);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt span{display:block;font-size:14px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{width:42px;flex:none}
.count{font:600 18px/1 var(--cond);color:var(--text-2);padding:0 10px;flex:none}
.prog{height:3px;background:var(--surface)}
.prog i{display:block;height:100%;width:0;background:var(--go);transition:width .3s ease}

/* train */
.today{margin:2px 16px 0;padding:12px;background:var(--surface);border-radius:20px}
.hero-board.board{border-radius:10px}
.today-copy{padding:16px 6px 6px}
.today-copy p{color:var(--text-2);font-size:16.5px;margin-top:6px}
.today-copy .up{font-size:15px;margin-top:2px}
.today-copy .up b{color:var(--text);font-weight:600}
.today-copy .btn{width:100%;margin-top:18px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:0 16px}
.day{height:54px;border-radius:12px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.day small{font-size:12.5px;font-weight:600;color:var(--text-3)}
.day .ic{width:18px;height:18px;stroke-width:2.6;color:var(--go-ink)}
.day.done{background:var(--go)}
.day.done small{color:var(--go-ink)}
.day.now:not(.done){box-shadow:inset 0 0 0 2px var(--text-3)}
.day.fut{opacity:.45}

/* lists */
.group{margin:0 16px;background:var(--surface);border-radius:16px;overflow:hidden}
.group.flush{margin:0}
.group.mt{margin-top:14px}
.group>*+*{border-top:1px solid var(--hair)}
.row{display:flex;align-items:center;gap:14px;padding:13px 14px 13px 16px;min-height:66px}
.row.off{opacity:.5}
.row:not(.off):active,.orow:active,.lrow:active,.brow:active{background:var(--surface-2)}
.tile{width:38px;height:38px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--text-2);flex:none}
.tile .ic{width:20px;height:20px}
.row .rt{flex:1;min-width:0;display:flex;flex-direction:column}
.row .rt b{font-weight:600;font-size:16.5px}
.row .rt span{font-size:14px;color:var(--text-2)}
.ic.chev{width:18px;height:18px;color:var(--text-3)}
.orow{display:flex;align-items:center;gap:14px;padding:12px 14px 12px 12px}
.orow .mb{width:64px;flex:none}
.ot{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ot b{font:600 21px/1.1 var(--cond)}
.ot .nota{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ot .sub{font-size:13.5px;color:var(--text-2)}
.ot .sub em{font-style:normal;color:var(--blue);font-weight:600}
.ring{position:relative;width:46px;height:46px;flex:none}
.ring svg{width:46px;height:46px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4;stroke-linecap:round}
.ring .rt{stroke:var(--surface-3)}
.ring .rv{stroke:var(--go)}
.ring.gold .rv{stroke:var(--gold)}
.ring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 15px/1 var(--cond)}
.ring small{font-size:10px;color:var(--text-2)}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 16px}
.lt{min-width:0}
.lt b{display:block;font-weight:600;font-size:16px}
.lt .nota{display:block;font-size:13px;margin-top:3px}
.lr{display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex:none}
.pill{font-style:normal;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px}
.pill.new{background:var(--surface-3);color:var(--text-2)}
.pill.due{background:rgba(106,168,232,.16);color:var(--blue)}
.pill.gold{background:rgba(226,176,70,.16);color:var(--gold)}
.bars{display:inline-flex;gap:3px}
.bars i{width:9px;height:5px;border-radius:2px;background:var(--surface-3)}
.bars i.on{background:var(--go)}
.bars.gold i.on{background:var(--gold)}
.brow{display:flex;align-items:center;gap:12px;padding:13px 14px}
.brow .nota{flex:none;font-size:15.5px}
.bn{flex:1;min-width:0;font-size:14.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* controls */
.seg{display:flex;margin:4px 16px 0;padding:3px;background:var(--surface);border-radius:12px}
.seg button{flex:1;height:40px;border-radius:9px;font-weight:600;font-size:15.5px;color:var(--text-2)}
.seg button.on{background:var(--surface-3);color:var(--text)}
.seg.sm{margin:0;padding:2px;flex:none}
.seg.sm button{height:32px;min-width:44px;padding:0 10px;font-size:14px}
.hint-text{margin:12px 16px 12px;color:var(--text-2);font-size:15px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 16px;border-radius:14px;background:var(--surface-2);color:var(--text);font:700 19px/1 var(--cond);letter-spacing:.2px;box-shadow:0 3px 0 rgba(0,0,0,.35);transition:transform .06s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.go{background:var(--go);color:var(--go-ink);box-shadow:0 4px 0 var(--go-edge)}
.btn.go:active{box-shadow:0 2px 0 var(--go-edge)}
.btn.big{height:58px;font-size:21px}
.btn.sm{height:44px;font-size:18px;margin-top:12px;padding:0 20px}
.btn[disabled]{opacity:.4;pointer-events:none}
.actions{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px;margin:18px 0 4px}
.switch{position:relative;width:52px;height:32px;border-radius:16px;background:var(--surface-3);transition:background .2s;flex:none}
.switch i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .2s}
.switch.on{background:var(--go)}
.switch.on i{transform:translateX(20px)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;min-height:58px;font-weight:500}
.danger{color:var(--red);font-weight:600;font-size:16px;padding:4px 0}
.btn.danger-btn{background:var(--red);color:#fff;box-shadow:0 4px 0 #9e2f29}
.foot{text-align:center;font-size:13.5px;color:var(--text-3);margin:18px 16px 0}
.foot.credits{font-size:12px;line-height:1.45;margin-top:10px}
.foot a{color:inherit;text-decoration:underline;text-underline-offset:2px}

/* opening page */
.pad{padding:0 16px}
.ideas{list-style:none;margin:14px 0 2px}
.ideas li{display:flex;gap:12px;align-items:baseline;padding:9px 0;border-top:1px solid var(--hair);font-size:15.5px}
.ideas li::before{content:"";flex:none;width:9px;height:9px;border-radius:2px;background:var(--sq-d);transform:translateY(-1px)}
.stage{width:100%}
.stage .board{border-radius:0;box-shadow:none}
@media (min-width:561px){.stage .board{border-radius:8px}}

/* progress */
.panel{margin:0 16px;padding:16px;background:var(--surface);border-radius:16px}
.big-line{color:var(--text-2);font-size:16px}
.big-line b{font:700 23px/1 var(--cond);color:var(--text)}
.stack{display:flex;gap:2px;height:10px;margin:14px 0 10px;border-radius:5px;overflow:hidden;background:var(--surface-3)}
.stack .m{background:var(--gold)}
.stack .l{background:var(--go)}
.stack .n{background:var(--surface-3)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px;color:var(--text-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.legend .m{background:var(--gold)}
.legend .l{background:var(--go)}
.legend .n{background:var(--surface-3)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 16px 0}
.trio>div{background:var(--surface);border-radius:14px;padding:14px 12px}
.trio b{display:block;font:700 30px/1 var(--cond)}
.trio span{display:block;font-size:13px;color:var(--text-2);margin-top:5px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cd{text-align:center;font-size:12.5px;font-weight:600;color:var(--text-3)}
.cc{aspect-ratio:1/1;border-radius:5px;background:#302d29}
.cc.dk{background:#262420}
.cc.on{background:var(--go)}
.cc.on.dk{background:#76a644}
.cc.now{box-shadow:inset 0 0 0 2px var(--text-2)}
.cc.fut{opacity:.35}

/* training */
.strip{position:relative;display:flex;align-items:center;gap:1px;min-height:46px;padding:6px 10px;overflow-x:auto;white-space:nowrap;background:var(--surface);scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip .no{font-size:14px;font-weight:600;color:var(--text-3);margin:0 2px 0 8px}
.strip .no:first-child{margin-left:4px}
.mv{font-weight:600;font-size:15.5px;padding:5px 7px;border-radius:7px;flex:none}
.mv.cur{background:var(--surface-3)}
.mv.fut{color:var(--text-3)}
.coach{--c:var(--text-2);display:flex;gap:12px;align-items:flex-start;margin-top:14px;padding:14px;background:var(--surface);border-radius:16px}
.coach.you,.coach.good{--c:var(--go)}
.coach.bad{--c:var(--red)}
.coach.hint{--c:var(--gold)}
.coach.info{--c:var(--blue)}
.ava{width:42px;height:42px;border-radius:50%;background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--c);display:grid;place-items:center;flex:none}
.ava .pc{width:30px;height:30px}
.ct{min-width:0;flex:1}
.ct b{display:block;font:700 20px/1.15 var(--cond);color:var(--c);margin-bottom:3px}
.ct p{font-size:15.5px;line-height:1.45}
.ct .prev{display:block;color:var(--text-2);font-size:14.5px;margin-bottom:6px}
.ct .end{color:var(--go);font-weight:600;margin-top:6px;font-size:15px}
.dock,.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;gap:6px;background:rgba(31,29,26,.96);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--hair)}
.dock{padding:8px max(10px,calc(50vw - 270px)) calc(env(safe-area-inset-bottom) + 8px)}
.dock button{flex:1;max-width:180px;height:56px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:600;font-size:12.5px}
.dock button:active{background:var(--surface-2)}
.dock button .ic{width:24px;height:24px}
.dock button.primary{background:var(--go);color:var(--go-ink)}
.dock button[disabled]{opacity:.3}
.dock button.step{flex:0 0 54px}
@media (max-width:359px){.dock button.step{flex-basis:42px}.dock button span{font-size:11.5px}}
.dock button:not(.step)+.step{margin-left:6px}
.ct .btn.sm{display:inline-flex;margin-top:12px}

/* play the computer: opponent ladder, player bars and clocks */
.sheet{max-height:calc(100vh - 16px);max-height:calc(100dvh - 16px);overflow-y:auto;overscroll-behavior:contain}
.res.play .seg.sm.wide{margin-top:12px}
.res.play .note{margin-top:10px}
#ptc button{padding:0 4px;white-space:nowrap}
@media (max-width:359px){#ptc button{font-size:13px}}
#pabout{min-height:2.9em}
.bots{display:flex;gap:8px;margin:16px -20px 0;padding:2px 20px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none}
.bots::-webkit-scrollbar{display:none}
.bot{position:relative;flex:0 0 78px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:10px 4px 9px;border-radius:14px;background:var(--surface-2);scroll-snap-align:center}
.bot .pc{width:38px;height:38px;margin-bottom:3px}
.bot b{font:700 17px/1.1 var(--cond)}
.bot span{font-size:13px;color:var(--text-2);font-variant-numeric:tabular-nums}
.bot.on{background:var(--surface-3);box-shadow:inset 0 0 0 2px var(--go)}
.bot .won{position:absolute;top:6px;right:6px;width:15px;height:15px;color:var(--go);stroke-width:3}
.pbar{display:flex;align-items:center;gap:10px;height:46px;padding:0 12px}
.pav{width:30px;height:30px;flex:none;border-radius:8px;background-color:var(--surface-2)}
.pn{display:flex;align-items:baseline;gap:6px;flex:none}
.pn b{font:700 17px/1 var(--cond)}
.pn small{font-size:13.5px;color:var(--text-2);font-variant-numeric:tabular-nums}
.caps{display:flex;align-items:center;flex:1;min-width:0;overflow:hidden}
.caps .pc{width:17px;height:17px;margin-right:-6px;flex:none}
.caps em{font-style:normal;font-size:13px;font-weight:600;color:var(--text-2);margin-left:10px}
.clk{margin-left:auto;min-width:78px;padding:6px 10px;border-radius:8px;background:var(--surface);color:var(--text-2);font:700 21px/1 var(--cond);text-align:right;font-variant-numeric:tabular-nums}
.clk.on{background:var(--text);color:#1b1a17}
.clk.low{color:var(--red)}
.clk.on.low{background:var(--red);color:#fff}
.rate{margin-top:12px;font-size:16px;color:var(--text-2)}
.rate b{font:700 26px/1 var(--cond);color:var(--text);margin:0 4px}
.rate em{font-style:normal;font-weight:700}
.rate .up{color:var(--go)}
.rate .down{color:var(--red)}
.rtile .tl{font-size:14px;color:var(--text-2)}
.rtile .tv{display:flex;align-items:baseline;gap:10px;margin-top:2px}
.rtile .tv b{font:700 40px/1 var(--cond)}
.rtile .tv em{font-style:normal;font-size:14px;font-weight:600;color:var(--text-2)}
.rtile .tv .up{color:var(--go)}
.rtile .tv .down{color:var(--red)}
.spark{display:block;width:100%;height:auto;margin-top:10px}
.spark polyline{fill:none;stroke:var(--text-3);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spark circle{fill:var(--go);stroke:var(--surface);stroke-width:2}
.rtile .tn{margin-top:10px;font-size:14px;color:var(--text-2)}

/* game review: how each move is rated */
.c-brilliant{--k:#1fb5a8}.c-great{--k:#5b8fc7}.c-best{--k:#7fb34a}.c-excellent{--k:#7fb34a}.c-good{--k:#8ea97f}
.c-book{--k:#a5875f}.c-inaccuracy{--k:#d9a536}.c-mistake{--k:#ec8434}.c-miss{--k:#ea6656}.c-blunder{--k:#dc4339}
.mk{display:inline-grid;place-items:center;flex:none;width:20px;height:20px;border-radius:50%;background:var(--k);color:#fff;font:700 11.5px/1 Barlow,system-ui,sans-serif;font-style:normal;letter-spacing:-.6px;text-shadow:0 1px 1px rgba(0,0,0,.25);vertical-align:-4px}
.mk svg{width:13px;height:13px;fill:currentColor}
.mv .mk{width:15px;height:15px;font-size:9px;margin-left:3px;vertical-align:-2px}
.mv .mk svg{width:10px;height:10px}
.mk.bdg{position:absolute;top:3%;right:3%;z-index:7;width:42%;height:42%;font-size:clamp(9px,2.9vw,14px);box-shadow:0 1px 3px rgba(0,0,0,.45);pointer-events:none}
.mk.bdg svg{width:64%;height:64%}
.opening{margin-top:14px;font:700 19px/1.2 var(--cond);color:var(--nota)}
.accs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.accs>div{background:var(--surface);border-radius:14px;padding:14px 12px;text-align:center}
.accs b{display:block;font:700 34px/1 var(--cond);font-variant-numeric:tabular-nums}
.accs span{display:block;font-size:13.5px;color:var(--text-2);margin-top:5px}
.ctab{margin-top:10px;background:var(--surface);border-radius:14px;padding:4px 0}
.chead,.crow{display:grid;grid-template-columns:22px 1fr 56px 72px;align-items:center;gap:10px;padding:0 14px}
.chead{height:32px;font-size:13px;font-weight:600;color:var(--text-2)}
.chead span:nth-child(n+3){text-align:right}
.crow{height:42px;border-top:1px solid var(--hair)}
.crow .cn{font-weight:600}
.crow b{font:700 19px/1 var(--cond);text-align:right;font-variant-numeric:tabular-nums}
.crow b+b{color:var(--text-2)}
.crow.none .cn,.crow.none b:first-of-type{color:var(--text-3)}
.crow[role=button]{cursor:pointer}
.crow[role=button]:active{background:var(--surface-2)}
.tabs{padding:6px max(10px,calc(50vw - 270px)) calc(env(safe-area-inset-bottom) + 4px)}
.tab{flex:1;max-width:160px;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--text-3);font-weight:600;font-size:12px}
.tab .ic{width:25px;height:25px}
.tab.on{color:var(--text)}
.tab.on .ic{color:var(--go)}

/* sheets and results */
.sheet-wrap{position:fixed;inset:0;z-index:60}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;padding:24px 20px calc(env(safe-area-inset-bottom) + 18px);background:#2c2a26;border-radius:22px 22px 0 0;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet-wrap.on .scrim{opacity:1}
.sheet-wrap.on .sheet{transform:none}
.res{text-align:center}
.res-ic{display:inline-grid;place-items:center;width:60px;height:60px;border-radius:50%;background:var(--go);color:var(--go-ink)}
.res-ic .ic{width:30px;height:30px;stroke-width:2.6}
.res.meh .res-ic{background:var(--gold)}
.res h2{font:700 30px/1.1 var(--cond);margin:12px 0 2px}
.lvl{display:flex;align-items:center;justify-content:center;gap:12px;margin:16px 0 6px}
.lvl .bars i{width:22px;height:7px}
.lvl span{font-size:14.5px;color:var(--text-2)}
.note{font-size:15px;color:var(--text-2);max-width:36ch;margin:8px auto 0}
.res .actions{margin-top:22px}
.intro h2{font:700 28px/1.1 var(--cond);margin-bottom:4px}
.intro .ideas li{font-size:15.5px;line-height:1.45}
.intro .ideas b{font-weight:600}
.intro .note{max-width:none;margin:12px 0 0}
.intro .actions{margin-top:18px}
.link-row:active{background:var(--surface-2)}
.lt .when{display:block;font-size:12.5px;color:var(--text-3);margin-top:2px}
.tac{padding:18px}
.rating{display:flex;align-items:baseline;gap:10px}
.rating b{font:700 56px/1 var(--cond);letter-spacing:-.5px}
.rating span{font-size:15px;color:var(--text-2)}
.tac p{color:var(--text-2);font-size:15.5px;margin-top:8px}
.tac .btn{width:100%;margin-top:16px}
.ct .th{color:var(--text);font-weight:600}
.delta{font-size:14.5px;color:var(--text-2);margin-top:6px}
.delta.up{color:var(--go);font-weight:600}
.delta.down{color:var(--red);font-weight:600}
.ic.okic{width:18px;height:18px;color:var(--go);stroke-width:2.6}
.seg.sm.wide{margin:14px 0 0}
.seg.sm.wide button{flex:1}
.trio.flat{margin:14px 0 0}
.trio b.red{color:var(--red)}
.trio b.gold{color:var(--gold)}
.book{margin-top:12px;font-size:15px;line-height:1.5;color:var(--text-2)}
.tab span{font-size:11px}
.tab .ic{width:24px;height:24px}
.bars i.pop{animation:pop .55s .25s both;transform-origin:left center}
@keyframes pop{0%{transform:scaleX(0);background:var(--surface-3)}60%{transform:scaleX(1.25)}100%{transform:none}}
.code{display:block;width:100%;height:112px;margin-top:14px;padding:12px;border-radius:12px;border:1px solid var(--hair);background:var(--bg);color:var(--text);font:13px/1.4 ui-monospace,Menlo,monospace;resize:none;word-break:break-all}
.sheet.top{top:0;bottom:auto;padding-top:calc(env(safe-area-inset-top) + 20px);padding-bottom:20px;border-radius:0 0 22px 22px;transform:translateY(-100%)}
.sum{padding:28px 16px 0;text-align:center}
.sum-ic{display:inline-grid;place-items:center;width:76px;height:76px;border-radius:50%;background:var(--surface);color:var(--gold)}
.sum-ic .ic{width:38px;height:38px}
.sum .display{margin:16px 0 6px}
.sum .trio{margin:24px 0 0}
.sum .actions{grid-auto-flow:row;margin-top:24px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);z-index:100;max-width:90vw;padding:11px 16px;border-radius:12px;background:#0f0e0c;color:#fff;font-weight:600;font-size:14.5px;text-align:center;pointer-events:none;opacity:0;transform:translate(-50%,-30px);transition:.25s}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* board */
.board{position:relative;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);aspect-ratio:1/1;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;border-radius:8px}
.board.mini{border-radius:5px}
.sq{position:relative}
.sq.l{background:var(--sq-l)}
.sq.d{background:var(--sq-d)}
.sq::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none}
.sq.last::before{background:rgba(255,255,51,.42)}
.sq.sel::before{background:rgba(255,255,51,.6)}
.sq.chk::before{background:radial-gradient(circle,rgba(255,30,30,.95) 0,rgba(255,30,30,.55) 40%,rgba(255,30,30,0) 72%)}
.sq.hint::before{background:rgba(255,176,0,.35);box-shadow:inset 0 0 0 4px #ffb000}
.sq.good::before{background:rgba(134,184,78,.7)}
.sq.bad::before{background:rgba(229,85,78,.7)}
.sq.dot::after{content:"";position:absolute;left:50%;top:50%;width:32%;height:32%;transform:translate(-50%,-50%);border-radius:50%;background:rgba(0,0,0,.2);z-index:3}
.sq.cap::after{content:"";position:absolute;inset:3%;border-radius:50%;border:5px solid rgba(0,0,0,.22);z-index:3}
.sq b{position:absolute;z-index:3;font-size:10.5px;font-weight:600;line-height:1;pointer-events:none}
.sq.l b{color:var(--sq-d)}
.sq.d b{color:var(--sq-l)}
.sq .rk{top:3px;left:3px}
.sq .fl{bottom:2px;right:3px}
.pc{display:block;background-size:100% 100%;background-repeat:no-repeat}
.sq .pc{position:absolute;inset:0;z-index:2}
.pc.ghost{position:fixed;left:0;top:0;z-index:1000;pointer-events:none}
.arrow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
.arrow line{stroke:rgba(255,168,0,.88);stroke-width:.17}
.arrow polygon{fill:rgba(255,168,0,.88)}
.board.shake{animation:shake .32s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</body>
</html>
